*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:"IBM Plex Sans Arabic", system-ui, sans-serif;
  line-height:1.75; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"IBM Plex Sans Arabic",sans-serif; font-weight:700; line-height:1.32; letter-spacing:-.02em; margin:0}
html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3{font-family:"Poppins",sans-serif; line-height:1.18; letter-spacing:-.03em}
button{font-family:inherit}
a{color:inherit}
img{max-width:100%}
.wrap{width:min(1120px,92vw); margin-inline:auto}
.section{padding-block:clamp(3.5rem,8vw,6.5rem)}
.section-head{max-width:60ch; margin-bottom:2.6rem}
.section-head h2{font-size:clamp(1.7rem,4vw,2.5rem); margin:.8rem 0 .6rem}
.section-head p{color:var(--stone); margin:0}
.eyebrow{
  font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; font-weight:600;
  color:var(--stone); display:flex; align-items:center; gap:.6rem; margin:0;
}
.eyebrow::before{
  content:""; width:16px; height:10px; flex:none;
  background:currentColor; -webkit-mask:var(--mark) center/contain no-repeat; mask:var(--mark) center/contain no-repeat;
}

/* header */
header{
  position:sticky; top:0; z-index:60; background:rgba(247,243,234,.88);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.bar{display:flex; align-items:center; gap:1.4rem; height:74px}
.brand{display:flex; align-items:center; gap:.7rem; text-decoration:none}
.brand img{height:34px; width:auto; display:block}
nav{margin-inline-start:auto; display:flex; align-items:center; gap:1.7rem}
nav a{text-decoration:none; font-size:.94rem; opacity:.7; transition:opacity .2s}
nav a:hover{opacity:1}
.lang{
  border:1px solid var(--ink); background:transparent; border-radius:999px;
  padding:.45rem 1rem; font-size:.8rem; font-weight:600; cursor:pointer;
  letter-spacing:.05em; transition:background .2s, color .2s;
}
.lang:hover{background:var(--ink); color:var(--cream)}

/* hero */
.hero{background:var(--ink); color:var(--cream); position:relative; overflow:hidden}
.hero::after{
  content:""; position:absolute; inset-block-end:-14%; inset-inline-start:-6%;
  width:min(560px,62vw); aspect-ratio:425/236; opacity:.055;
  background:var(--cream); -webkit-mask:var(--mark) center/contain no-repeat; mask:var(--mark) center/contain no-repeat;
  pointer-events:none;
}
.hero-inner{position:relative; z-index:1; padding-block:clamp(3.5rem,9vw,6.2rem); display:grid; gap:3rem; grid-template-columns:1.15fr .85fr; align-items:center}
.hero h1{font-size:clamp(2.2rem,6vw,4rem); margin:1.1rem 0 1.2rem}
.hero .lede{font-size:clamp(1rem,2.2vw,1.13rem); color:rgba(247,243,234,.68); max-width:46ch; margin:0 0 2.1rem}
.hero .eyebrow{color:rgba(247,243,234,.62)}
.cta-row{display:flex; gap:.8rem; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; justify-content:center; text-decoration:none; cursor:pointer;
  padding:.9rem 1.7rem; border-radius:999px; font-weight:600; font-size:.95rem;
  border:1px solid transparent; transition:transform .18s, background .2s, color .2s, border-color .2s;
}
.btn:active{transform:translateY(1px)}
.hero .btn-primary{background:var(--cream); color:var(--ink)}
.hero .btn-primary:hover{background:#fff}
.btn-primary{background:var(--ink); color:var(--cream)}
.btn-primary:hover{background:var(--ink-2)}
.btn-ghost{border-color:var(--line-light); color:var(--cream)}
.btn-ghost:hover{background:rgba(247,243,234,.09)}
.hero-card{background:rgba(247,243,234,.05); border:1px solid var(--line-light); border-radius:var(--r); padding:1.8rem}
.score{display:flex; align-items:baseline; gap:.6rem}
.score b{font-size:3.3rem; font-family:"Poppins",sans-serif; font-weight:600; line-height:1; letter-spacing:-.04em}
.score span{color:rgba(247,243,234,.55); font-size:.88rem}
.hero-card .stars{margin:.55rem 0 1.4rem}

/* bars */
.bar-row{display:grid; grid-template-columns:1fr auto; gap:.35rem .9rem; margin-bottom:1rem; font-size:.88rem}
.bar-row .val{font-weight:600; font-variant-numeric:tabular-nums}
.track{grid-column:1/-1; height:5px; border-radius:99px; background:rgba(11,11,11,.1); overflow:hidden}
.hero-card .track{background:rgba(247,243,234,.16)}
.track i{display:block; height:100%; width:0; background:var(--ink); border-radius:99px; transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.hero-card .track i{background:var(--cream)}
.hero-card .bar-row .label{color:rgba(247,243,234,.75)}

/* stars */
.stars{display:inline-flex; gap:3px; direction:ltr}
.stars svg{width:16px; height:16px; flex:none}
.stars .s{fill:rgba(11,11,11,.16)}
.stars .on{fill:var(--ink)}
.hero .stars .s, .reviews .stars .s{fill:rgba(247,243,234,.22)}
.hero .stars .on, .reviews .stars .on{fill:var(--cream)}
.rate-input{display:inline-flex; gap:5px; direction:ltr}
.rate-input button{background:none; border:0; padding:2px; cursor:pointer; line-height:0; transition:transform .15s}
.rate-input button:hover{transform:scale(1.2)}
.rate-input svg{width:25px; height:25px; fill:rgba(11,11,11,.16); transition:fill .15s}
.rate-input button.on svg{fill:var(--ink)}

/* menu */
.menu-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(268px,1fr)); gap:1.1rem}
.item{
  background:var(--cream-2); border:1px solid var(--line); border-radius:var(--r); padding:1.45rem;
  transition:transform .28s cubic-bezier(.2,.7,.2,1), box-shadow .28s, border-color .28s;
}
.item:hover{transform:translateY(-5px); box-shadow:var(--shadow); border-color:rgba(11,11,11,.3)}
.item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:1rem}
.item h3{font-size:1.06rem}
.price{font-family:"Poppins",sans-serif; font-weight:600; font-size:1rem; white-space:nowrap; font-variant-numeric:tabular-nums}
.item p{margin:.55rem 0 1rem; color:var(--stone); font-size:.92rem; line-height:1.65}
.item-foot{display:flex; align-items:center; gap:.55rem; font-size:.8rem; color:var(--stone); border-top:1px solid var(--line); padding-top:.85rem}
.tag{
  font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; font-weight:600;
  color:var(--cream); background:var(--ink); padding:.25rem .6rem; border-radius:999px; margin-inline-start:auto;
}

/* reviews */
.reviews{background:var(--ink-2); color:var(--cream); overflow:hidden}
.reviews .section-head p{color:rgba(247,243,234,.6)}
.reviews .eyebrow{color:rgba(247,243,234,.6)}
.ribbon{
  position:relative; margin-inline:calc(50% - 50vw); width:100vw; direction:ltr; padding-block:.45rem;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
}
.ribbon + .ribbon{margin-top:1rem}
.rib-track{display:flex; gap:1rem; width:max-content; animation:slide 48s linear infinite}
.ribbon.rev .rib-track{animation-direction:reverse; animation-duration:58s}
.ribbon:hover .rib-track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)} to{transform:translateX(-50%)}}
.rev-card{
  width:330px; flex:none; background:rgba(247,243,234,.055); border:1px solid var(--line-light);
  border-radius:var(--r); padding:1.3rem; transition:background .25s, border-color .25s, transform .25s;
}
.rev-card:hover{background:rgba(247,243,234,.11); border-color:rgba(247,243,234,.4); transform:translateY(-3px)}
.rev-card .txt{font-size:.93rem; color:rgba(247,243,234,.85); margin:.75rem 0 1.1rem; line-height:1.7}
.who{display:flex; align-items:center; gap:.65rem}
.av{width:34px; height:34px; border-radius:12px; flex:none; display:grid; place-items:center; background:rgba(247,243,234,.14); font-weight:600; font-size:.85rem}
.who .n{font-size:.87rem; font-weight:600}
.who .m{font-size:.74rem; color:rgba(247,243,234,.45)}
.rev-card.fresh{animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0; transform:scale(.9)} to{opacity:1; transform:scale(1)}}

/* rate panel */
.panel{display:grid; grid-template-columns:1fr 1fr; gap:1.8rem; background:var(--cream-2); border:1px solid var(--line); border-radius:var(--r); padding:clamp(1.4rem,3.6vw,2.3rem)}
.panel h2{font-size:1.45rem; margin:.75rem 0 .55rem}
.field{display:block; margin-bottom:.95rem}
.field span{display:block; font-size:.84rem; color:var(--stone); margin-bottom:.4rem}
input[type=text], textarea{
  width:100%; font-family:inherit; font-size:.95rem; color:var(--ink); background:var(--cream);
  border:1px solid var(--line); border-radius:14px; padding:.75rem .95rem; transition:border-color .2s, box-shadow .2s;
}
input[type=text]:focus, textarea:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px rgba(11,11,11,.09)}
textarea{resize:vertical; min-height:94px; line-height:1.6}
.note{font-size:.83rem; color:var(--stone); margin:.75rem 0 0}
.ok{color:var(--ink); font-weight:600}

/* visit */
.info-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.info{background:var(--cream-2); padding:1.6rem}
.info h3{margin:.7rem 0 .4rem; font-size:1rem}
.info p{margin:0; color:var(--stone); font-size:.92rem}

  /* ====== نهاية البيانات ====== */

  var $ = function(s,c){return (c||document).querySelector(s);};
  var lang = "ar";

  function starSvg(f){
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="'+(f?'on':'s')+'" d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.1 6.47L12 17.45 6.2 20.5l1.1-6.47L2.6 9.45l6.5-.95z"/></svg>';

  function starsHTML(r){var h="";for(var i=1;i<=5;i++)h+=starSvg(i<=Math.round(r));return h;}
  function t(o){return lang==="ar"?o.ar:o.en;}

  function buildMenu(){
    $("#menuGrid").innerHTML = MENU.map(function(m){
      var tag = lang==="ar"?m.tar:m.ten;
      return '<article class="item reveal"><div class="item-top"><h3>'+(lang==="ar"?m.ar:m.en)+'</h3>'
        +'<span class="price">'+m.p+'</span></div><p>'+(lang==="ar"?m.dar:m.den)+'</p>'

        +(tag?'<span class="tag">'+tag+'</span>':'')+'</div></article>';
    }).join("");
    observeReveal();
  }

  function buildBars(host){
    host.innerHTML = CATS.map(function(c,i){
      return '<div class="bar-row"><span class="label">'+t(c)+'</span><span class="val" data-v="'+i+'">'+c.v.toFixed(1)+'</span>'
        +'<span class="track"><i data-fill="'+i+'"></i></span></div>';
    }).join("");
  }
  function fillBars(host){
    if(!host) return;
    CATS.forEach(function(c,i){
      var el=host.querySelector('[data-fill="'+i+'"]'); if(el) el.style.width=(c.v/5*100).toFixed(1)+"%";
      var v=host.querySelector('[data-v="'+i+'"]'); if(v) v.textContent=c.v.toFixed(1);
    });
  }

  function buildRateRows(){
    var host=$("#rateRows");
    host.innerHTML = CATS.map(function(c,i){
      return '<div class="bar-row" style="align-items:center"><span class="label">'+t(c)+'</span>'

    }).join("");

      g.addEventListener("click", function(e){
        var b=e.target.closest("button"); if(!b) return;

        buildBars($("#heroBars")); fillBars($("#heroBars"));
        updateAvg();
      });

    fillBars(host);
  }

  function updateAvg(){
    var a=CATS.reduce(function(s,c){return s+c.v;},0)/CATS.length;

  function card(r){
    return '<article class="rev-card" dir="'+(lang==="ar"?"rtl":"ltr")+'"><span class="stars">'+starsHTML(r.r)+'</span>'

  }
  function buildRibbons(){
    var half=Math.ceil(REVIEWS.length/2);
    var a=REVIEWS.slice(0,half), b=REVIEWS.slice(half);

    $("#track1").innerHTML=(a.map(card).join("")).repeat(2);
    $("#track2").innerHTML=(b.map(card).join("")).repeat(2);
  }

      msg.textContent = lang==="ar" ? "اكتب اسمك ورأيك عشان ننشره." : "Add your name and a few words to post it.";
      return;
    }
    REVIEWS.unshift({n:name, m:(lang==="ar"?"رأي جديد":"Just posted"), r:myStars, ar:txt, en:txt});
    buildRibbons();
    $("#track1").firstElementChild.classList.add("fresh");
    var c=$("#revCount"); c.textContent=(+c.textContent+1);
    msg.className="note ok";
    msg.textContent = lang==="ar" ? "شكراً لك — رأيك ظاهر الحين في شريط الآراء." : "Thank you — your review is live in the ribbon below.";
    $("#rName").value=""; $("#rText").value="";
    document.getElementById("reviews").scrollIntoView({behavior:"smooth", block:"center"});
  });

  function applyLang(){
    var h=document.documentElement;
    h.lang=lang; h.dir = lang==="ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-ar]").forEach(function(el){
      el.textContent = lang==="ar" ? el.dataset.ar : el.dataset.en;
    });
    $("#langBtn").textContent = lang==="ar" ? "English" : "العربية";
    buildMenu(); buildBars($("#heroBars")); fillBars($("#heroBars"));
    buildRateRows(); buildRibbons(); updateAvg();
  }
  $("#langBtn").addEventListener("click", function(){ lang = lang==="ar" ? "en":"ar"; applyLang(); });

  var io;
  function observeReveal(){
    if(!("IntersectionObserver" in window)){
      document.querySelectorAll(".reveal").forEach(function(e){e.classList.add("in");}); return;
    }
    if(!io){
      io=new IntersectionObserver(function(en){
        en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target);} });
      },{threshold:.12, rootMargin:"0px 0px -40px"});
    }
    document.querySelectorAll(".reveal:not(.in)").forEach(function(e){io.observe(e);});
  }

  applyLang(); observeReveal();
  setTimeout(function(){ fillBars($("#heroBars")); fillBars($("#rateRows")); },350);
})();
</script>
</body>
</html>
